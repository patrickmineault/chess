<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Endgame Practice — Mate in 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }

  h1 {
    font-size: 1.4rem;
    color: #e0e0e0;
    text-align: center;
  }

  .puzzle-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .puzzle-btn {
    padding: 8px 16px;
    border: 2px solid #444;
    background: #2a2a3e;
    color: #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }

  .puzzle-btn:hover {
    background: #3a3a5e;
  }

  .puzzle-btn.active {
    border-color: #4fc3f7;
    background: #1a3a5e;
    color: #4fc3f7;
    font-weight: bold;
  }

  .board-wrapper {
    position: relative;
    width: min(80vw, 560px);
    height: min(80vw, 560px);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
    border: 3px solid #555;
    border-radius: 4px;
    overflow: hidden;
    touch-action: none;
  }

  .square {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: min(9vw, 58px);
    line-height: 1;
    position: relative;
    cursor: default;
  }

  .square.light { background: #f0d9b5; }
  .square.dark { background: #b58863; }
  .square .white-piece {
    color: #fff;
    text-shadow:
      -1px -1px 0 #333,
       1px -1px 0 #333,
      -1px  1px 0 #333,
       1px  1px 0 #333,
       0   -1px 0 #333,
       0    1px 0 #333,
      -1px  0   0 #333,
       1px  0   0 #333;
  }

  .square .black-piece {
    color: #222;
    text-shadow:
      -1px -1px 0 #888,
       1px -1px 0 #888,
      -1px  1px 0 #888,
       1px  1px 0 #888;
  }

  .square.draggable { cursor: grab; }
  .square.drag-over { box-shadow: inset 0 0 0 4px rgba(79, 195, 247, 0.7); }
  .square.move-from { background: rgba(255, 255, 100, 0.5); }
  .square.move-to { background: rgba(100, 255, 100, 0.5); }

  /* File labels (bottom row) */
  .square[data-row="7"]::after {
    content: attr(data-file-label);
    position: absolute;
    bottom: 2px;
    right: 4px;
    font-size: min(2.2vw, 12px);
    font-weight: bold;
    pointer-events: none;
  }
  .square[data-row="7"].light::after { color: #b58863; }
  .square[data-row="7"].dark::after { color: #f0d9b5; }

  /* Rank labels (left column) */
  .square[data-col="0"]::before {
    content: attr(data-rank-label);
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: min(2.2vw, 12px);
    font-weight: bold;
    pointer-events: none;
  }
  .square[data-col="0"].light::before { color: #b58863; }
  .square[data-col="0"].dark::before { color: #f0d9b5; }

  #ghost {
    position: fixed;
    pointer-events: none;
    font-size: min(9vw, 58px);
    line-height: 1;
    z-index: 1000;
    opacity: 0.85;
    display: none;
    transform: translate(-50%, -50%);
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
  }

  #ghost.white-piece {
    color: #fff;
    text-shadow:
      -1px -1px 0 #333,
       1px -1px 0 #333,
      -1px  1px 0 #333,
       1px  1px 0 #333,
       0   -1px 0 #333,
       0    1px 0 #333,
      -1px  0   0 #333,
       1px  0   0 #333;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    border-radius: 4px;
    padding: 20px;
    text-align: center;
  }

  .overlay.show { display: flex; }

  .overlay-content {
    padding: 24px 32px;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: bold;
    max-width: 90%;
    line-height: 1.4;
  }

  .overlay.success {
    background: rgba(0, 100, 0, 0.6);
  }
  .overlay.success .overlay-content {
    background: #2e7d32;
    color: #fff;
    box-shadow: 0 4px 20px rgba(46, 125, 50, 0.5);
  }

  .overlay.failure {
    background: rgba(100, 0, 0, 0.5);
  }
  .overlay.failure .overlay-content {
    background: #c62828;
    color: #fff;
    box-shadow: 0 4px 20px rgba(198, 40, 40, 0.5);
  }

  #status {
    font-size: 1rem;
    color: #aaa;
    text-align: center;
    min-height: 1.4em;
  }

  #reset-btn {
    padding: 8px 24px;
    border: 2px solid #555;
    background: #2a2a3e;
    color: #ccc;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s;
  }

  #reset-btn:hover {
    background: #3a3a5e;
    border-color: #888;
  }
</style>
</head>
<body>
<div id="app">
  <h1>Chess Endgame Practice</h1>
  <div class="puzzle-selector">
    <button class="puzzle-btn active" data-idx="0">Puzzle 1: Back Rank</button>
    <button class="puzzle-btn" data-idx="1">Puzzle 2: Queen Support</button>
    <button class="puzzle-btn" data-idx="2">Puzzle 3: Smothered Mate</button>
    <button class="puzzle-btn" data-idx="3">Puzzle 4: Boden's Mate</button>
    <button class="puzzle-btn" data-idx="4">Puzzle 5: Rook & Knight</button>
  </div>
  <div class="board-wrapper">
    <div id="board"></div>
    <div id="success-overlay" class="overlay success">
      <div class="overlay-content" id="success-msg"></div>
    </div>
    <div id="failure-overlay" class="overlay failure">
      <div class="overlay-content">Not checkmate. Try again!</div>
    </div>
  </div>
  <div id="status">White to move — find the checkmate!</div>
  <button id="reset-btn">Reset Position</button>
</div>
<div id="ghost"></div>

<script>
const PIECE_UNICODE = {
  wK: '\u2654', wQ: '\u2655', wR: '\u2656', wB: '\u2657', wN: '\u2658', wP: '\u2659',
  bK: '\u265A', bQ: '\u265B', bR: '\u265C', bB: '\u265D', bN: '\u265E', bP: '\u265F'
};

const FILES = 'abcdefgh';

// Puzzle definitions: pieces array and solution {from, to, notation}
// Row 0 = rank 8, col 0 = a-file
const PUZZLES = [
  {
    name: 'Back Rank Mate',
    pieces: [
      { type: 'wK', row: 2, col: 1 }, // Kb6
      { type: 'wR', row: 7, col: 3 }, // Rd1
      { type: 'bK', row: 0, col: 0 }, // Ka8
      { type: 'bR', row: 1, col: 0 }, // Ra7
    ],
    solution: { fromRow: 7, fromCol: 3, toRow: 0, toCol: 3, notation: 'Rd8#' }
  },
  {
    name: 'Queen Support Mate',
    pieces: [
      { type: 'wK', row: 7, col: 6 }, // Kg1
      { type: 'wQ', row: 2, col: 6 }, // Qg6
      { type: 'wB', row: 5, col: 3 }, // Bd3
      { type: 'bK', row: 0, col: 7 }, // Kh8
      { type: 'bR', row: 0, col: 6 }, // Rg8
      { type: 'bP', row: 1, col: 7 }, // Ph7
    ],
    solution: { fromRow: 2, fromCol: 6, toRow: 1, toCol: 7, notation: 'Qxh7#' }
  },
  {
    name: 'Smothered Mate',
    pieces: [
      { type: 'wK', row: 7, col: 2 }, // Kc1
      { type: 'wN', row: 1, col: 5 }, // Nf7
      { type: 'bK', row: 0, col: 6 }, // Kg8
      { type: 'bR', row: 0, col: 7 }, // Rh8
      { type: 'bR', row: 0, col: 5 }, // Rf8
      { type: 'bN', row: 1, col: 6 }, // Ng7
      { type: 'bP', row: 1, col: 7 }, // Ph7
    ],
    solution: { fromRow: 1, fromCol: 5, toRow: 2, toCol: 7, notation: 'Nh6#' }
  },
  {
    name: "Boden's Mate",
    pieces: [
      { type: 'wK', row: 7, col: 4 }, // Ke1
      { type: 'wB', row: 3, col: 1 }, // Bb5
      { type: 'wB', row: 3, col: 4 }, // Be5
      { type: 'bK', row: 0, col: 2 }, // Kc8
      { type: 'bP', row: 1, col: 3 }, // Pd7
      { type: 'bR', row: 0, col: 3 }, // Rd8
    ],
    solution: { fromRow: 3, fromCol: 1, toRow: 2, toCol: 0, notation: 'Ba6#' }
  },
  {
    name: 'Rook & Knight Mate',
    pieces: [
      { type: 'wK', row: 7, col: 2 }, // Kc1
      { type: 'wR', row: 3, col: 7 }, // Rh5
      { type: 'wN', row: 2, col: 6 }, // Ng6
      { type: 'bK', row: 0, col: 6 }, // Kg8
      { type: 'bP', row: 1, col: 5 }, // Pf7
      { type: 'bP', row: 1, col: 6 }, // Pg7
    ],
    solution: { fromRow: 3, fromCol: 7, toRow: 0, toCol: 7, notation: 'Rh8#' }
  }
];

let board = [];
let currentPuzzleIndex = 0;
let solved = false;
let dragState = null;

const boardEl = document.getElementById('board');
const ghostEl = document.getElementById('ghost');
const successOverlay = document.getElementById('success-overlay');
const failureOverlay = document.getElementById('failure-overlay');
const successMsg = document.getElementById('success-msg');
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('reset-btn');
const puzzleBtns = document.querySelectorAll('.puzzle-btn');

function initBoard(puzzleIndex) {
  board = Array.from({ length: 8 }, () => Array(8).fill(null));
  const puzzle = PUZZLES[puzzleIndex];
  for (const p of puzzle.pieces) {
    board[p.row][p.col] = p.type;
  }
}

function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      const isLight = (r + c) % 2 === 0;
      sq.className = 'square ' + (isLight ? 'light' : 'dark');
      sq.dataset.row = r;
      sq.dataset.col = c;
      sq.dataset.fileLabel = FILES[c];
      sq.dataset.rankLabel = String(8 - r);

      const piece = board[r][c];
      if (piece) {
        const span = document.createElement('span');
        span.className = piece.startsWith('w') ? 'white-piece' : 'black-piece';
        span.textContent = PIECE_UNICODE[piece];
        sq.appendChild(span);
        if (!solved && piece.startsWith('w')) {
          sq.classList.add('draggable');
        }
      }
      boardEl.appendChild(sq);
    }
  }
}

function selectPuzzle(idx) {
  currentPuzzleIndex = idx;
  solved = false;
  successOverlay.classList.remove('show');
  failureOverlay.classList.remove('show');
  statusEl.textContent = 'White to move — find the checkmate!';
  puzzleBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.idx) === idx));
  initBoard(idx);
  renderBoard();
}

// --- Piece movement legality ---

function isInsideBoard(r, c) {
  return r >= 0 && r < 8 && c >= 0 && c < 8;
}

function isPathClear(fromRow, fromCol, toRow, toCol) {
  const dr = Math.sign(toRow - fromRow);
  const dc = Math.sign(toCol - fromCol);
  let r = fromRow + dr;
  let c = fromCol + dc;
  while (r !== toRow || c !== toCol) {
    if (board[r][c] !== null) return false;
    r += dr;
    c += dc;
  }
  return true;
}

function isLegalMove(piece, fromRow, fromCol, toRow, toCol) {
  if (fromRow === toRow && fromCol === toCol) return false;
  if (!isInsideBoard(toRow, toCol)) return false;

  const target = board[toRow][toCol];
  // Can't capture own pieces
  if (target && target[0] === piece[0]) return false;

  const type = piece[1]; // K, Q, R, B, N, P
  const dr = toRow - fromRow;
  const dc = toCol - fromCol;
  const absDr = Math.abs(dr);
  const absDc = Math.abs(dc);

  switch (type) {
    case 'K':
      return absDr <= 1 && absDc <= 1;
    case 'N':
      return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
    case 'R':
      if (dr !== 0 && dc !== 0) return false;
      return isPathClear(fromRow, fromCol, toRow, toCol);
    case 'B':
      if (absDr !== absDc) return false;
      return isPathClear(fromRow, fromCol, toRow, toCol);
    case 'Q':
      if (dr !== 0 && dc !== 0 && absDr !== absDc) return false;
      return isPathClear(fromRow, fromCol, toRow, toCol);
    case 'P': {
      const dir = piece[0] === 'w' ? -1 : 1;
      if (dc === 0 && dr === dir && !target) return true;
      if (dc === 0 && dr === 2 * dir && fromRow === (piece[0] === 'w' ? 6 : 1) && !target && !board[fromRow + dir][fromCol]) return true;
      if (absDc === 1 && dr === dir && target) return true;
      return false;
    }
    default:
      return false;
  }
}

// --- Drag and Drop ---

function getSquareFromPoint(x, y) {
  const elements = document.elementsFromPoint(x, y);
  for (const el of elements) {
    if (el.classList.contains('square')) {
      return { row: Number(el.dataset.row), col: Number(el.dataset.col), el };
    }
  }
  return null;
}

function onPointerDown(e) {
  if (solved) return;
  const sq = getSquareFromPoint(e.clientX, e.clientY);
  if (!sq) return;

  const piece = board[sq.row][sq.col];
  if (!piece || !piece.startsWith('w')) return;

  e.preventDefault();
  dragState = {
    piece,
    fromRow: sq.row,
    fromCol: sq.col,
    pointerId: e.pointerId
  };

  // Hide piece on board
  sq.el.textContent = '';
  sq.el.innerHTML = '';
  sq.el.classList.add('move-from');

  // Show ghost (always white piece since only white can drag)
  ghostEl.textContent = PIECE_UNICODE[piece];
  ghostEl.className = 'white-piece';
  ghostEl.style.display = 'block';
  ghostEl.style.left = e.clientX + 'px';
  ghostEl.style.top = e.clientY + 'px';

  boardEl.setPointerCapture(e.pointerId);
}

function onPointerMove(e) {
  if (!dragState) return;

  ghostEl.style.left = e.clientX + 'px';
  ghostEl.style.top = e.clientY + 'px';

  // Highlight square under pointer
  boardEl.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  const sq = getSquareFromPoint(e.clientX, e.clientY);
  if (sq) {
    sq.el.classList.add('drag-over');
  }
}

function onPointerUp(e) {
  if (!dragState) return;

  ghostEl.style.display = 'none';
  boardEl.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  boardEl.querySelectorAll('.move-from').forEach(el => el.classList.remove('move-from'));

  const sq = getSquareFromPoint(e.clientX, e.clientY);
  const { piece, fromRow, fromCol } = dragState;
  dragState = null;

  if (sq && isLegalMove(piece, fromRow, fromCol, sq.row, sq.col)) {
    attemptMove(piece, fromRow, fromCol, sq.row, sq.col);
  } else {
    // Return piece to original square
    renderBoard();
  }
}

function attemptMove(piece, fromRow, fromCol, toRow, toCol) {
  const puzzle = PUZZLES[currentPuzzleIndex];
  const sol = puzzle.solution;

  if (fromRow === sol.fromRow && fromCol === sol.fromCol && toRow === sol.toRow && toCol === sol.toCol) {
    // Correct! Execute move on board
    board[toRow][toCol] = piece;
    board[fromRow][fromCol] = null;
    solved = true;
    renderBoard();

    // Highlight the move
    const fromSq = boardEl.querySelector(`.square[data-row="${fromRow}"][data-col="${fromCol}"]`);
    const toSq = boardEl.querySelector(`.square[data-row="${toRow}"][data-col="${toCol}"]`);
    if (fromSq) fromSq.classList.add('move-from');
    if (toSq) toSq.classList.add('move-to');

    successMsg.textContent = `Checkmate! ${sol.notation} — Well done!`;
    successOverlay.classList.add('show');
    statusEl.textContent = `Solved: ${sol.notation}`;
  } else {
    // Wrong move — restore and show failure
    renderBoard();
    failureOverlay.classList.add('show');
    setTimeout(() => {
      failureOverlay.classList.remove('show');
    }, 1500);
  }
}

// --- Event listeners ---

boardEl.addEventListener('pointerdown', onPointerDown);
boardEl.addEventListener('pointermove', onPointerMove);
boardEl.addEventListener('pointerup', onPointerUp);
boardEl.addEventListener('pointercancel', () => {
  if (dragState) {
    dragState = null;
    ghostEl.style.display = 'none';
    boardEl.querySelectorAll('.drag-over, .move-from').forEach(el => {
      el.classList.remove('drag-over', 'move-from');
    });
    renderBoard();
  }
});

puzzleBtns.forEach(btn => {
  btn.addEventListener('click', () => selectPuzzle(Number(btn.dataset.idx)));
});

resetBtn.addEventListener('click', () => selectPuzzle(currentPuzzleIndex));

// Init
selectPuzzle(0);
</script>
</body>
</html>
