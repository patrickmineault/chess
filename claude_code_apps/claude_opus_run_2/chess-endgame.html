<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Endgame Practice - Mate in 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: #e0e0e0;
            text-align: center;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-area {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #chess-board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #8b4513;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .square {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        .square.light {
            background-color: #f0d9b5;
        }

        .square.dark {
            background-color: #b58863;
        }

        .square.highlight {
            background-color: #aaa23a !important;
        }

        .square.valid-move {
            position: relative;
        }

        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }

        .square.valid-move.has-piece::after {
            width: 100%;
            height: 100%;
            background-color: transparent;
            border: 4px solid rgba(0, 0, 0, 0.3);
            border-radius: 0;
            box-sizing: border-box;
        }

        .piece {
            cursor: grab;
            transition: transform 0.1s;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.3);
        }

        .piece:active {
            cursor: grabbing;
        }

        .piece.dragging {
            opacity: 0.5;
        }

        .controls {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 250px;
        }

        .controls h2 {
            color: #e0e0e0;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .scenario-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .scenario-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: left;
        }

        .scenario-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(58, 123, 213, 0.4);
        }

        .scenario-btn.active {
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
        }

        .scenario-btn.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        #reset-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        #reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.4);
        }

        #status {
            color: #e0e0e0;
            font-size: 1.1rem;
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #status.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            font-weight: bold;
            animation: pulse 0.5s ease-in-out;
        }

        #status.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .instructions {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        @media (max-width: 900px) {
            #chess-board {
                grid-template-columns: repeat(8, 50px);
                grid-template-rows: repeat(8, 50px);
            }
            .square {
                width: 50px;
                height: 50px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chess Endgame Practice</h1>
        <p style="color: #aaa; margin-bottom: 10px;">White to move - Find the Mate in 1!</p>

        <div class="game-area">
            <div class="board-container">
                <div id="chess-board"></div>
                <div id="status">Select a scenario to begin</div>
            </div>

            <div class="controls">
                <h2>Scenarios</h2>
                <div class="scenario-list">
                    <button class="scenario-btn" data-scenario="0">1. Back Rank Mate</button>
                    <button class="scenario-btn" data-scenario="1">2. Smothered Mate</button>
                    <button class="scenario-btn" data-scenario="2">3. Knight & Rook Mate</button>
                    <button class="scenario-btn" data-scenario="3">4. Bishop & Queen Mate</button>
                    <button class="scenario-btn" data-scenario="4">5. Two Rooks Mate</button>
                </div>
                <button id="reset-btn">Reset Position</button>
                <div class="instructions">
                    <strong>How to play:</strong><br>
                    • Drag and drop pieces to move<br>
                    • Find the checkmate in one move<br>
                    • Green = Correct! Red = Try again
                </div>
            </div>
        </div>
    </div>

    <script>
        // Chess piece unicode characters
        const PIECES = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Mate in 1 scenarios - verified positions with explicit escape square analysis
        const scenarios = [
            {
                name: "Back Rank Mate",
                // King g8, pawns f7/g7/h7. Escape squares: f8, h8 - both empty but on back rank
                // Ra1-a8#: Check on 8th rank. f8? Rook covers. h8? Rook covers. f7/g7/h7? Own pawns.
                // VALID: Rook controls entire 8th rank
                position: {
                    'a1': 'R', 'g1': 'K',
                    'g8': 'k', 'f7': 'p', 'g7': 'p', 'h7': 'p'
                },
                solution: { from: 'a1', to: 'a8' },
                hint: "The king is trapped on the back rank!"
            },
            {
                name: "Smothered Mate",
                // Classic smothered mate: King h8 in corner, surrounded by own pieces
                // Rg8 blocks g8, pawn g7 blocks g7, pawn h7 blocks h7
                // Knight on f7 delivers Nf7-g5? No. Need knight to jump IN.
                // Setup: Kh8, Rg8, pg7. Knight on f7 gives check - but king not in check yet.
                // Knight must MOVE to give mate. Ng6-f8#? No.
                // Classic: Kh8, Rg8, Nh6, need to block h7. Ng8 is blocked.
                // Philidor's legacy: Kh8, Qg8 (just sacrificed), Rg8 takes, Nf7#
                // Position after Qg8+, Rxg8: Kh8, Rg8 (black), Knight somewhere to mate
                // Nf7#: Knight on f7 attacks h8 (no it doesn't - f7 to h8 is 2,1 = valid!)
                // Actually f7 to h8: col f=5 to h=7 (diff 2), row 7 to 8 (diff 1). YES knight attacks h8!
                // So Kh8, Rg8, Nf7 is checkmate already? No we need to DELIVER it.
                // Nh6-f7 doesn't attack h8. Wait: h6 to f7 is the move. After Nf7, knight ON f7.
                // f7 attacks: d6, d8, e5, g5, h6, h8. YES h8!
                // Kh8, Rg8 blocks g8, but can king take Nf7? h8 to f7 is not adjacent. King moves 1 square.
                // h8 to g8 (blocked by rook), h8 to g7 (need block), h8 to h7 (need block)
                // Add pg7, ph7: Kh8, Rg8, pg7, ph7. Nh6-f7#
                // King can't go anywhere: g8(rook), g7(pawn), h7(pawn). Knight checks from f7, attacks h8. VALID!
                position: {
                    'h6': 'N', 'g1': 'K',
                    'h8': 'k', 'g8': 'r', 'g7': 'p', 'h7': 'p'
                },
                solution: { from: 'h6', to: 'f7' },
                hint: "The king is smothered by his own pieces!"
            },
            {
                name: "Knight & Rook Mate",
                // Two rooks on 7th rank deliver mate
                // Kg8, Rooks on g7 and h7 would be mate but we need to DELIVER it
                // Setup: Kg8, pf7. White Rg7 (check!), Rh1. Rh1-h8#?
                // After Rh8#: escapes f8(?), h7(Rg7 controls), g7(Rg7 there), f7(pawn)
                // f8 is free! Need to block f8.
                // Add Rf8 (black): Kg8, Rf8, pf7. Rg7+, Rh1-h8#.
                // Wait Rg7 gives check first. This is not mate in 1.
                // Different setup: Rooks already doubled, one moves to deliver mate.
                // Kh8, pg7, ph7. Ra7, Rb7. Can't mate - king not in check.
                // Simpler approach - Arabian mate pattern:
                // Kh8, Nf7 controls g8 and h6. Rh1-h8#? Nf7 attacks h8? f7 to h8 = 2,1 = yes!
                // But wait - Nf7 attacks h8 means Rh8 would be protected? No - we want king stuck.
                // Kh8 escapes: g8 (Nf7 attacks? f7 to g8 = 1,1 = no, not knight move). g8 free! INVALID.
                // Nf7 attacks from f7: d6, d8, e5, g5, h6, h8. NOT g8!
                // Need to cover g8. Second piece. Rook on g-file? Rg1-g8 is the mate?
                // Kh8, Rg1-g8#. Escapes: h7(?), g7(?). Need to block h7, g7.
                // Kh8, ph7, Ng6 (controls h8, f8, e7, e5, f4, h4). Rg1-g8#.
                // Escapes: g7(?), h7(pawn). g7 attacked by Ng6? g6 to g7 = 0,1 = no. INVALID.
                // Ng5 attacks g7? g5 to g7 = 0,2 = no.
                // Nf6 attacks g8 and h7! f6 to g8 = 1,2 = yes. f6 to h7 = 2,1 = yes.
                // Kh8, Nf6. Rg1-g8#. Escapes: g7(?), h7(Nf6), g8(rook). g7 free!
                // Add pg7: Kh8, pg7, Nf6. Rg1-g8#.
                // Escapes: g7(pawn), h7(Nf6). VALID!
                position: {
                    'g1': 'R', 'f6': 'N', 'e1': 'K',
                    'h8': 'k', 'g7': 'p'
                },
                solution: { from: 'g1', to: 'g8' },
                hint: "The knight seals off the king's escape!"
            },
            {
                name: "Bishop & Queen Mate",
                // King g8, blocks: f8 (rook), f7 (pawn), h7 (pawn)
                // Qh6-g7#: Queen checks on g7. King escapes: f8 (rook), h8?, f7 (pawn), h7 (pawn)
                // h8 is free! Bishop on b2 (a1-h8 diagonal) controls h8!
                // After Qg7#: f8 (rook), h8 (bishop), f7 (pawn), h7 (pawn). VALID
                position: {
                    'h6': 'Q', 'b2': 'B', 'g1': 'K',
                    'g8': 'k', 'f8': 'r', 'f7': 'p', 'h7': 'p'
                },
                solution: { from: 'h6', to: 'g7' },
                hint: "The bishop guards the escape square!"
            },
            {
                name: "Two Rooks Mate",
                // Black king h1. White rooks coordinate.
                // Rg2 controls: g1, g2, g3..., h2, f2, etc.
                // Ra3-a1#: Rook checks on a1. Escape: g1 (Rg2 controls), h2 (Rg2 controls), g2 (rook there)
                // VALID
                position: {
                    'a3': 'R', 'g2': 'R', 'c1': 'K',
                    'h1': 'k'
                },
                solution: { from: 'a3', to: 'a1' },
                hint: "The rooks work together!"
            }
        ];

        let currentScenario = null;
        let board = {};
        let selectedSquare = null;
        let draggedPiece = null;
        let draggedFrom = null;
        let completedScenarios = new Set();

        const boardElement = document.getElementById('chess-board');
        const statusElement = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');
        const scenarioBtns = document.querySelectorAll('.scenario-btn');

        function createBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    const squareName = String.fromCharCode(97 + col) + (8 - row);
                    square.className = `square ${(row + col) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.square = squareName;

                    square.addEventListener('dragover', handleDragOver);
                    square.addEventListener('drop', handleDrop);
                    square.addEventListener('click', handleSquareClick);

                    boardElement.appendChild(square);
                }
            }
        }

        function renderBoard() {
            document.querySelectorAll('.square').forEach(square => {
                const squareName = square.dataset.square;
                const piece = board[squareName];

                square.innerHTML = '';
                square.classList.remove('highlight', 'valid-move', 'has-piece');

                if (piece) {
                    const pieceSpan = document.createElement('span');
                    pieceSpan.className = 'piece';
                    pieceSpan.textContent = PIECES[piece];
                    pieceSpan.draggable = isWhitePiece(piece);

                    if (isWhitePiece(piece)) {
                        pieceSpan.addEventListener('dragstart', handleDragStart);
                        pieceSpan.addEventListener('dragend', handleDragEnd);
                    }

                    square.appendChild(pieceSpan);
                }
            });
        }

        function isWhitePiece(piece) {
            return piece && piece === piece.toUpperCase();
        }

        function isBlackPiece(piece) {
            return piece && piece === piece.toLowerCase();
        }

        function loadScenario(index) {
            currentScenario = index;
            board = { ...scenarios[index].position };
            selectedSquare = null;

            scenarioBtns.forEach((btn, i) => {
                btn.classList.remove('active');
                if (i === index) btn.classList.add('active');
                if (completedScenarios.has(i)) btn.classList.add('completed');
            });

            statusElement.textContent = `${scenarios[index].name} - White to move!`;
            statusElement.className = '';

            renderBoard();
        }

        function resetPosition() {
            if (currentScenario !== null) {
                loadScenario(currentScenario);
            }
        }

        function handleDragStart(e) {
            const square = e.target.closest('.square');
            const squareName = square.dataset.square;
            const piece = board[squareName];

            if (!isWhitePiece(piece)) {
                e.preventDefault();
                return;
            }

            draggedPiece = piece;
            draggedFrom = squareName;
            e.target.classList.add('dragging');

            // Highlight valid moves
            showValidMoves(squareName, piece);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            clearHighlights();
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const targetSquare = e.target.closest('.square');
            if (!targetSquare || !draggedFrom) return;

            const to = targetSquare.dataset.square;
            tryMove(draggedFrom, to);

            draggedPiece = null;
            draggedFrom = null;
            clearHighlights();
        }

        function handleSquareClick(e) {
            const square = e.target.closest('.square');
            const squareName = square.dataset.square;
            const piece = board[squareName];

            if (selectedSquare) {
                // Try to move
                if (squareName !== selectedSquare) {
                    tryMove(selectedSquare, squareName);
                }
                selectedSquare = null;
                clearHighlights();
            } else if (piece && isWhitePiece(piece)) {
                // Select piece
                selectedSquare = squareName;
                square.classList.add('highlight');
                showValidMoves(squareName, piece);
            }
        }

        function showValidMoves(from, piece) {
            const moves = getValidMoves(from, piece);
            moves.forEach(to => {
                const square = document.querySelector(`[data-square="${to}"]`);
                if (square) {
                    square.classList.add('valid-move');
                    if (board[to]) square.classList.add('has-piece');
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('highlight', 'valid-move', 'has-piece');
            });
        }

        function getValidMoves(from, piece) {
            const moves = [];
            const [fromCol, fromRow] = [from.charCodeAt(0) - 97, parseInt(from[1])];
            const pieceType = piece.toUpperCase();

            for (let col = 0; col < 8; col++) {
                for (let row = 1; row <= 8; row++) {
                    const to = String.fromCharCode(97 + col) + row;
                    if (to === from) continue;
                    if (board[to] && isWhitePiece(board[to])) continue;

                    if (isValidPieceMove(pieceType, fromCol, fromRow, col, row)) {
                        moves.push(to);
                    }
                }
            }

            return moves;
        }

        function isValidPieceMove(pieceType, fromCol, fromRow, toCol, toRow) {
            const dx = Math.abs(toCol - fromCol);
            const dy = Math.abs(toRow - fromRow);
            const from = String.fromCharCode(97 + fromCol) + fromRow;
            const to = String.fromCharCode(97 + toCol) + toRow;

            switch (pieceType) {
                case 'K':
                    return dx <= 1 && dy <= 1;
                case 'Q':
                    return (dx === 0 || dy === 0 || dx === dy) && !isPathBlocked(from, to);
                case 'R':
                    return (dx === 0 || dy === 0) && !isPathBlocked(from, to);
                case 'B':
                    return dx === dy && !isPathBlocked(from, to);
                case 'N':
                    return (dx === 2 && dy === 1) || (dx === 1 && dy === 2);
                case 'P':
                    const direction = 1; // White pawns move up
                    if (board[to] && isBlackPiece(board[to])) {
                        // Capture
                        return dx === 1 && (toRow - fromRow) === direction;
                    }
                    // Forward move
                    return dx === 0 && (toRow - fromRow) === direction && !board[to];
                default:
                    return false;
            }
        }

        function isPathBlocked(from, to) {
            const [fromCol, fromRow] = [from.charCodeAt(0) - 97, parseInt(from[1])];
            const [toCol, toRow] = [to.charCodeAt(0) - 97, parseInt(to[1])];

            const dx = Math.sign(toCol - fromCol);
            const dy = Math.sign(toRow - fromRow);

            let col = fromCol + dx;
            let row = fromRow + dy;

            while (col !== toCol || row !== toRow) {
                const square = String.fromCharCode(97 + col) + row;
                if (board[square]) return true;
                col += dx;
                row += dy;
            }

            return false;
        }

        function tryMove(from, to) {
            const piece = board[from];
            if (!piece || !isWhitePiece(piece)) return;

            const [fromCol, fromRow] = [from.charCodeAt(0) - 97, parseInt(from[1])];
            const [toCol, toRow] = [to.charCodeAt(0) - 97, parseInt(to[1])];

            if (!isValidPieceMove(piece.toUpperCase(), fromCol, fromRow, toCol, toRow)) {
                return;
            }

            // Check if capturing own piece
            if (board[to] && isWhitePiece(board[to])) return;

            // Make the move
            const capturedPiece = board[to];
            board[to] = piece;
            delete board[from];

            renderBoard();

            // Check if it's the correct solution
            const solution = scenarios[currentScenario].solution;
            if (from === solution.from && to === solution.to) {
                statusElement.textContent = '🎉 Checkmate! Well done!';
                statusElement.className = 'success';
                completedScenarios.add(currentScenario);
                scenarioBtns[currentScenario].classList.add('completed');
            } else if (isCheckmate()) {
                // Alternative checkmate found
                statusElement.textContent = '🎉 Checkmate! Great find!';
                statusElement.className = 'success';
                completedScenarios.add(currentScenario);
                scenarioBtns[currentScenario].classList.add('completed');
            } else {
                statusElement.textContent = 'Not checkmate - try again!';
                statusElement.className = 'error';
            }
        }

        function isCheckmate() {
            // Find black king
            let blackKingPos = null;
            for (const [square, piece] of Object.entries(board)) {
                if (piece === 'k') {
                    blackKingPos = square;
                    break;
                }
            }

            if (!blackKingPos) return false;

            // Check if king is in check
            if (!isSquareAttacked(blackKingPos, true)) {
                return false;
            }

            // Check if king can escape
            const [kingCol, kingRow] = [blackKingPos.charCodeAt(0) - 97, parseInt(blackKingPos[1])];

            for (let dc = -1; dc <= 1; dc++) {
                for (let dr = -1; dr <= 1; dr++) {
                    if (dc === 0 && dr === 0) continue;

                    const newCol = kingCol + dc;
                    const newRow = kingRow + dr;

                    if (newCol < 0 || newCol > 7 || newRow < 1 || newRow > 8) continue;

                    const newSquare = String.fromCharCode(97 + newCol) + newRow;

                    // Can't move to square with own piece
                    if (board[newSquare] && isBlackPiece(board[newSquare])) continue;

                    // Can't move to attacked square
                    if (!isSquareAttacked(newSquare, true)) {
                        return false;
                    }
                }
            }

            // Check if any black piece can block or capture
            for (const [square, piece] of Object.entries(board)) {
                if (!isBlackPiece(piece) || piece === 'k') continue;

                const moves = getBlackMoves(square, piece);
                for (const move of moves) {
                    // Simulate move
                    const originalTarget = board[move];
                    const originalPiece = board[square];
                    board[move] = piece;
                    delete board[square];

                    const stillInCheck = isSquareAttacked(blackKingPos, true);

                    // Undo move
                    board[square] = originalPiece;
                    if (originalTarget) {
                        board[move] = originalTarget;
                    } else {
                        delete board[move];
                    }

                    if (!stillInCheck) {
                        return false;
                    }
                }
            }

            return true;
        }

        function getBlackMoves(from, piece) {
            const moves = [];
            const [fromCol, fromRow] = [from.charCodeAt(0) - 97, parseInt(from[1])];
            const pieceType = piece.toUpperCase();

            for (let col = 0; col < 8; col++) {
                for (let row = 1; row <= 8; row++) {
                    const to = String.fromCharCode(97 + col) + row;
                    if (to === from) continue;
                    if (board[to] && isBlackPiece(board[to])) continue;

                    let valid = false;
                    switch (pieceType) {
                        case 'K':
                            valid = Math.abs(col - fromCol) <= 1 && Math.abs(row - fromRow) <= 1;
                            break;
                        case 'Q':
                            valid = ((col - fromCol === 0) || (row - fromRow === 0) ||
                                    Math.abs(col - fromCol) === Math.abs(row - fromRow)) &&
                                    !isPathBlocked(from, to);
                            break;
                        case 'R':
                            valid = ((col - fromCol === 0) || (row - fromRow === 0)) &&
                                    !isPathBlocked(from, to);
                            break;
                        case 'B':
                            valid = Math.abs(col - fromCol) === Math.abs(row - fromRow) &&
                                    !isPathBlocked(from, to);
                            break;
                        case 'N':
                            const dx = Math.abs(col - fromCol);
                            const dy = Math.abs(row - fromRow);
                            valid = (dx === 2 && dy === 1) || (dx === 1 && dy === 2);
                            break;
                        case 'P':
                            const direction = -1; // Black pawns move down
                            if (board[to] && isWhitePiece(board[to])) {
                                valid = Math.abs(col - fromCol) === 1 && (row - fromRow) === direction;
                            } else {
                                valid = col === fromCol && (row - fromRow) === direction && !board[to];
                            }
                            break;
                    }

                    if (valid) moves.push(to);
                }
            }

            return moves;
        }

        function isSquareAttacked(square, byWhite) {
            const [col, row] = [square.charCodeAt(0) - 97, parseInt(square[1])];

            for (const [pieceSquare, piece] of Object.entries(board)) {
                if (byWhite && !isWhitePiece(piece)) continue;
                if (!byWhite && !isBlackPiece(piece)) continue;

                const [pCol, pRow] = [pieceSquare.charCodeAt(0) - 97, parseInt(pieceSquare[1])];
                const dx = Math.abs(col - pCol);
                const dy = Math.abs(row - pRow);

                const pieceType = piece.toUpperCase();
                let attacks = false;

                switch (pieceType) {
                    case 'K':
                        attacks = dx <= 1 && dy <= 1;
                        break;
                    case 'Q':
                        attacks = ((dx === 0 || dy === 0 || dx === dy) &&
                                  !isPathBlocked(pieceSquare, square));
                        break;
                    case 'R':
                        attacks = ((dx === 0 || dy === 0) &&
                                  !isPathBlocked(pieceSquare, square));
                        break;
                    case 'B':
                        attacks = (dx === dy && !isPathBlocked(pieceSquare, square));
                        break;
                    case 'N':
                        attacks = (dx === 2 && dy === 1) || (dx === 1 && dy === 2);
                        break;
                    case 'P':
                        const direction = byWhite ? 1 : -1;
                        attacks = dx === 1 && (row - pRow) === direction;
                        break;
                }

                if (attacks) return true;
            }

            return false;
        }

        // Event listeners
        scenarioBtns.forEach((btn, index) => {
            btn.addEventListener('click', () => loadScenario(index));
        });

        resetBtn.addEventListener('click', resetPosition);

        // Initialize
        createBoard();
    </script>
