<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Endgame Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chess Endgame Practice</h1>
        <p class="instructions">Find mate in 1 for White!</p>

        <div class="controls">
            <label for="scenario">Select Scenario:</label>
            <select id="scenario">
                <option value="0">Scenario 1: Queen Mate</option>
                <option value="1">Scenario 2: Two Rooks Mate</option>
                <option value="2">Scenario 3: Ladder Mate</option>
            </select>
            <button id="reset">Reset Position</button>
        </div>

        <div id="feedback" class="feedback hidden"></div>

        <div id="board" class="board"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
